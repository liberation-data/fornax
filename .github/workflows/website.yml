# Builds the website (website/) and publishes it to GitHub Pages at kiln4j.org. A pull request that touches the site
# builds it without publishing it.
name: Website

on:
    push:
        branches: [main]
        paths: ['website/**', '.github/workflows/website.yml']
    pull_request:
        paths: ['website/**', '.github/workflows/website.yml']
    # Daily, so a new Kiln Studio release shows on the site without a push here (src/lib/github.ts reads it at build
    # time). GitHub runs a schedule only from the default branch's copy of this file.
    schedule:
        - cron: '23 3 * * *'
    workflow_dispatch:

permissions:
    contents: read

# One publish at a time, never cut short; a pull request's build is cut short by its next push.
concurrency:
    group: ${{ github.event_name == 'pull_request' && format('website-{0}', github.ref) || 'pages' }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: website/package-lock.json
            - run: npm ci
              working-directory: website
            - run: npm run build
              working-directory: website
              env:
                  # For Kiln Studio's latest release, without the anonymous API's rate limit.
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - if: github.event_name != 'pull_request'
              uses: actions/upload-pages-artifact@v5
              with:
                  path: website/dist

    deploy:
        if: github.event_name != 'pull_request'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
