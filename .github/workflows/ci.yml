# The gate on every pull request (and on main after a merge): the build and its model-free tests, then a release
# canary that publishes everything to a throwaway repository and builds samples/hello-fornax against only that.
#
# No natives are built here (release.yml does that, for hours): the Java modules compile and test against none, and
# the tests that need an engine library or a model skip themselves. Runners have no GPU and no models.
#
# NO SECRETS. Signing uses a key made for this run and thrown away with it.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a pull request replaces its run; every merge to main gets its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VERSION: 0.0.0-ci
  # Resolves the sample's runtime dependencies too (its natives jar), which `mvn compile` alone never does.
  RESOLVE: org.apache.maven.plugins:maven-dependency-plugin:3.8.1:resolve

jobs:
  build:
    name: Build, test and release canary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # The last one listed is JAVA_HOME. 22 is what the jars are compiled for (options.release in build.gradle).
          java-version: |
            22
            25
          cache: gradle

      # Compiles every module, builds the jars, javadoc and the CLI's distributions, and runs the tests that need no
      # engine library and no model.
      - name: Build and test
        run: ./gradlew --no-daemon build

      - name: Test on Java 22
        run: ./gradlew --no-daemon test -Pfornax.testJdk=22 -Porg.gradle.java.installations.fromEnv=JAVA_HOME_22_X64

      # What release.yml signs and uploads, into a local repository: every module's pom, jar, sources and javadoc, and
      # a natives jar (empty here: settings.gradle includes a platform once its build/native directory exists).
      - name: Publish to a throwaway repository
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --quiet --passphrase '' --quick-gen-key 'Fornax CI canary <ci@invalid>' ed25519 sign never
          export ORG_GRADLE_PROJECT_signingInMemoryKey="$(gpg --batch --armor --export-secret-keys)"
          export ORG_GRADLE_PROJECT_signingInMemoryKeyPassword=''
          mkdir -p build/native/linux-x86_64-vulkan
          ./gradlew --no-daemon publishToMavenLocal -Pversion="$VERSION" -Dmaven.repo.local="$RUNNER_TEMP/m2"
          repo="$RUNNER_TEMP/m2/org/fornax4j"
          for a in fornax-core fornax-llama fornax-tts fornax-sd fornax-acestep fornax-yue2 fornax-whisper fornax-demucs fornax-server fornax-cli \
                   fornax-natives-linux-x86_64-vulkan; do
            for f in "$a-$VERSION.pom" "$a-$VERSION.jar" "$a-$VERSION-sources.jar" "$a-$VERSION-javadoc.jar"; do
              [ -f "$repo/$a/$VERSION/$f" ] || { echo "::error::$f was not built"; exit 1; }
              [ -f "$repo/$a/$VERSION/$f.asc" ] || { echo "::error::$f was not signed"; exit 1; }
            done
          done
          for a in fornax-bom fornax-natives; do   # POMs only
            [ -f "$repo/$a/$VERSION/$a-$VERSION.pom" ] || { echo "::error::$a-$VERSION.pom was not built"; exit 1; }
            [ -f "$repo/$a/$VERSION/$a-$VERSION.pom.asc" ] || { echo "::error::$a-$VERSION.pom was not signed"; exit 1; }
          done
          # The CLI takes the host's natives through fornax-natives' OS profiles (Maven and JBang activate them), never
          # the natives jar of whichever platform built it.
          cli="$repo/fornax-cli/$VERSION/fornax-cli-$VERSION.pom"
          grep -q '<artifactId>fornax-natives</artifactId>' "$cli" || { echo "::error::fornax-cli's POM doesn't depend on fornax-natives"; exit 1; }
          if grep -q '<artifactId>fornax-natives-' "$cli"; then echo "::error::fornax-cli's POM names one platform's natives jar"; exit 1; fi
          unzip -p "$repo/fornax-cli/$VERSION/fornax-cli-$VERSION.jar" META-INF/MANIFEST.MF | grep -q '^Main-Class: ' \
            || { echo "::error::fornax-cli's jar has no Main-Class, which jbang runs"; exit 1; }

      # samples/hello-fornax, a standalone build, against only that repository: the coordinates users copy resolve.
      - name: Build the sample against it
        run: |
          set -euo pipefail
          samples/hello-fornax/gradlew --no-daemon -p samples/hello-fornax installDist -PfornaxLocal=true -PfornaxVersion="$VERSION" -Dmaven.repo.local="$RUNNER_TEMP/m2"
          mvn -B -q -f samples/hello-fornax/pom.xml compile $RESOLVE -DoutputFile="$RUNNER_TEMP/maven-deps.txt" -Dfornax.version="$VERSION" -Dmaven.repo.local="$RUNNER_TEMP/m2"
          # fornax-natives' OS profiles, not the sample's POM, bring in this machine's natives jar
          grep -q 'org.fornax4j:fornax-natives-linux-x86_64-vulkan:jar' "$RUNNER_TEMP/maven-deps.txt" \
            || { echo "::error::Maven took no natives jar from fornax-natives"; cat "$RUNNER_TEMP/maven-deps.txt"; exit 1; }
