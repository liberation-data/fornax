// Kiln: in-process generative models for the JVM via Java's Foreign Function & Memory API.

def os = System.getProperty('os.name').toLowerCase().contains('mac') ? 'macos' : 'linux'
def arch = System.getProperty('os.arch').replace('amd64', 'x86_64').replace('aarch64', 'arm64')
def nativeDir = file("build/native/${os}-${arch}-${findProperty('kiln.backend')}")

subprojects {
    apply plugin: 'java-library'

    repositories { mavenCentral() }

    java {
        toolchain { languageVersion = JavaLanguageVersion.of(25) }
        withSourcesJar()
        withJavadocJar()
    }

    tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xlint:all,-restricted'] }
    tasks.withType(Javadoc).configureEach { options.addBooleanOption('Xdoclint:none', true) }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.13.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        jvmArgs '--enable-native-access=ALL-UNNAMED'
        systemProperty 'kiln.library.path', nativeDir.absolutePath
        testLogging { events 'passed', 'skipped', 'failed'; showStandardStreams = true }
    }

    if (name != 'kiln-core') dependencies { api project(':kiln-core') }
}

project(':kiln-examples') {
    dependencies {
        implementation project(':kiln-llama')
        implementation project(':kiln-sd')
        implementation project(':kiln-acestep')
        implementation project(':kiln-yue2')
    }
    // ./gradlew chat --args='"your prompt"'   image --args='klein out.png "a prompt"'   song   yue2
    [chat: 'Chat', image: 'Image', song: 'Song', yue2: 'Yue2Song', single: 'Single'].each { task, cls ->
        tasks.register(task, JavaExec) {
            group = 'kiln examples'
            description = "Runs org.liberationdata.kiln.examples.${cls}"
            classpath = sourceSets.main.runtimeClasspath
            mainClass = "org.liberationdata.kiln.examples.${cls}"
            javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
            jvmArgs '--enable-native-access=ALL-UNNAMED'
            systemProperty 'kiln.library.path', nativeDir.absolutePath
            workingDir = rootProject.projectDir
            // -Pmodel=... -Psteps=... etc. become system properties (only ones given on the command line)
            def cli = gradle.startParameter.projectProperties
            ['model', 'steps', 'width', 'height', 'seed', 'repeat', 'dit', 'lm', 'quant'].each { p ->
                if (cli.containsKey(p)) systemProperty p, cli[p]
            }
        }
    }
}

project(':kiln-cli') {
    apply plugin: 'application'
    dependencies {
        implementation project(':kiln-llama')
        implementation project(':kiln-sd')
        implementation project(':kiln-acestep')
        implementation project(':kiln-yue2')
    }
    // ./gradlew :kiln-cli:installDist  ->  kiln-cli/build/install/kiln-cli/bin/kiln
    // The distribution carries the native libraries in lib/native/<os>-<arch>-<backend>/ and points the launcher at
    // them; KILN_OPTS / JAVA_OPTS can override (for example -Dkiln.library.path=...).
    application {
        mainClass = 'org.liberationdata.kiln.cli.Main'
        applicationName = 'kiln'
        applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED',
                                     "-Dkiln.library.path=__APP_HOME__/lib/native/${nativeDir.name}".toString()]
    }
    distributions {
        main {
            distributionBaseName = 'kiln-cli'
            contents { from(nativeDir) { into "lib/native/${nativeDir.name}" } }
        }
    }
    tasks.named('startScripts') {
        doLast {
            unixScript.text = unixScript.text.replace('__APP_HOME__', '\'"$APP_HOME"\'')
            windowsScript.text = windowsScript.text.replace('__APP_HOME__', '%APP_HOME%')
        }
    }
    tasks.named('jar') {
        manifest { attributes 'Implementation-Title': 'Kiln', 'Implementation-Version': project.version }
    }
    // ./gradlew :kiln-cli:run --args='info'
    tasks.named('run', JavaExec) {
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
        jvmArgs = ['--enable-native-access=ALL-UNNAMED']
        systemProperty 'kiln.library.path', nativeDir.absolutePath
        standardInput = System.in
    }
}

project(':kiln-bench') {
    dependencies {
        implementation project(':kiln-acestep')
        implementation project(':kiln-sd')
        implementation project(':kiln-yue2')
        implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.0'
    }
    // ./gradlew bench --args='out/bench acestep yue2 qwen-image'
    tasks.register('bench', JavaExec) {
        group = 'kiln examples'
        description = 'A/B: the same jobs through ComfyUI and through Kiln'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'org.liberationdata.kiln.bench.Bench'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
        jvmArgs '--enable-native-access=ALL-UNNAMED'
        systemProperty 'kiln.library.path', nativeDir.absolutePath
        workingDir = rootProject.projectDir
        def cli = gradle.startParameter.projectProperties
        ['size', 'steps'].each { p -> if (cli.containsKey(p)) systemProperty p, cli[p] }
    }
}
